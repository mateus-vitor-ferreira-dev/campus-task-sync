name: sync

on:
  schedule:
    # A cada 30 minutos (horario UTC). O GitHub pode atrasar execucoes agendadas
    # em periodos de fila alta; o intervalo real costuma variar alguns minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sincronizar Campus -> Notion
        run: npm run sync
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NOTION_ASSIGNEE_USER_ID: ${{ secrets.NOTION_ASSIGNEE_USER_ID }}
